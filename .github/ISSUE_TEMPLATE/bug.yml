name: Bug report
description: Something in the app doesn't work as expected
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What you did and what you expected. }
    validations: { required: true }
  - type: input
    id: app-version
    attributes: { label: App version, placeholder: "More → About" }
  - type: input
    id: spree-version
    attributes: { label: Spree version, placeholder: "4.2.5" }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [iOS, Android, iPad, Web] }
